server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints asset filenames, so they can be cached forever. A missing
    # asset must 404 rather than fall through to index.html: serving HTML for a
    # stale .js request leaves the page blank after a rebuild.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html points at the current asset hashes, so browsers must revalidate
    # it on every load or they keep requesting assets from an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
