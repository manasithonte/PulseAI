services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulseai
    ports:
      - "5432:5432"
    volumes:
      - pulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulseai"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulseai
      MODEL_TYPE: ${MODEL_TYPE:-isolation_forest}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/ml/artifacts:/app/app/ml/artifacts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  simulator:
    build: ./simulator
    environment:
      REDIS_URL: redis://redis:6379/0
      NODE_COUNT: "50"
      PUBLISH_INTERVAL_SECONDS: "0.5"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pulse_pg_data:
